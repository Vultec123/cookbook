<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stephanie's Cozy Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="recipes-data.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── PIN LOCK SCREEN ── */
  .pin-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: oklch(97% 0.018 80);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    font-family: 'Lato', system-ui, sans-serif;
    animation: fadeIn 0.4s ease;
  }
  body.dark .pin-overlay { background: oklch(16% 0.02 60); }

  .pin-card {
    background: oklch(93% 0.025 78);
    border-radius: 28px;
    padding: 48px 44px 44px;
    display: flex; flex-direction: column; align-items: center;
    gap: 28px;
    width: 100%; max-width: 360px;
    box-shadow: 0 8px 48px oklch(30% 0.05 50 / 0.12);
    border: 1.5px solid oklch(89% 0.03 76);
  }
  body.dark .pin-card {
    background: oklch(20% 0.025 58);
    border-color: oklch(24% 0.03 55);
    box-shadow: 0 8px 48px oklch(0% 0 0 / 0.4);
  }

  .pin-brand {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-align: center;
  }
  .pin-brand-icon { font-size: 44px; line-height: 1; }
  .pin-brand h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px; font-weight: 700;
    color: oklch(30% 0.05 50);
    line-height: 1.2;
  }
  body.dark .pin-brand h1 { color: oklch(90% 0.03 60); }
  .pin-brand p {
    font-size: 13px;
    color: oklch(55% 0.04 55);
    margin-top: 2px;
  }

  .pin-dots {
    display: flex; gap: 12px;
  }
  .pin-dot {
    width: 16px; height: 16px;
    border-radius: 99px;
    border: 2px solid oklch(78% 0.09 50);
    background: transparent;
    transition: all 0.15s ease;
  }
  .pin-dot.filled { background: oklch(58% 0.12 42); border-color: oklch(58% 0.12 42); }
  .pin-dot.error { border-color: oklch(55% 0.18 25); background: oklch(55% 0.18 25); animation: shake 0.4s ease; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .pin-error-msg {
    font-size: 12.5px;
    color: oklch(55% 0.18 25);
    font-weight: 700;
    height: 16px;
    text-align: center;
  }

  /* PIN KEYPAD */
  .pin-keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
  }
  .pin-key {
    height: 58px;
    border-radius: 14px;
    border: 1.5px solid oklch(89% 0.03 76);
    background: oklch(97% 0.018 80);
    color: oklch(22% 0.04 50);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px; font-weight: 700;
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  body.dark .pin-key {
    background: oklch(24% 0.03 55);
    border-color: oklch(28% 0.03 55);
    color: oklch(90% 0.03 60);
  }
  .pin-key:hover { background: oklch(92% 0.04 55); border-color: oklch(58% 0.12 42); transform: scale(1.03); }
  .pin-key:active { transform: scale(0.96); background: oklch(58% 0.12 42); color: white; border-color: oklch(58% 0.12 42); }
  .pin-key.del { font-size: 18px; color: oklch(55% 0.04 55); }
  .pin-key.empty { pointer-events: none; background: transparent; border-color: transparent; }


  :root {
    --cream: oklch(97% 0.018 80);
    --cream-dark: oklch(93% 0.025 78);
    --cream-deeper: oklch(89% 0.03 76);
    --terra: oklch(58% 0.12 42);
    --terra-light: oklch(78% 0.09 50);
    --terra-pale: oklch(92% 0.04 55);
    --walnut: oklch(30% 0.05 50);
    --walnut-mid: oklch(45% 0.06 48);
    --sage: oklch(62% 0.07 155);
    --text: oklch(22% 0.04 50);
    --text-muted: oklch(55% 0.04 55);
    --card-shadow: 0 2px 20px oklch(30% 0.05 50 / 0.1);
    --card-shadow-hover: 0 8px 40px oklch(30% 0.05 50 / 0.18);
    --sidebar-w: 240px;
    --header-h: 72px;
    --radius: 16px;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Lato', system-ui, sans-serif;
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
  }

  body.dark {
    --cream: oklch(16% 0.02 60);
    --cream-dark: oklch(20% 0.025 58);
    --cream-deeper: oklch(24% 0.03 55);
    --terra: oklch(72% 0.1 50);
    --terra-pale: oklch(28% 0.05 55);
    --walnut: oklch(90% 0.03 60);
    --walnut-mid: oklch(75% 0.04 58);
    --text: oklch(92% 0.02 60);
    --text-muted: oklch(65% 0.03 58);
    --card-shadow: 0 2px 20px oklch(0% 0 0 / 0.3);
    --card-shadow-hover: 0 8px 40px oklch(0% 0 0 / 0.45);
  }

  html, body { height: 100%; background: var(--cream); color: var(--text); font-family: var(--font-body); }
  
  #root { height: 100%; display: flex; flex-direction: column; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--terra-light); border-radius: 99px; }

  /* ── HEADER ── */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--header-h);
    background: var(--cream);
    border-bottom: 1px solid var(--cream-deeper);
    display: flex; align-items: center;
    padding: 0 24px;
    gap: 16px;
  }

  .header-brand {
    display: flex; align-items: baseline; gap: 10px;
    flex-shrink: 0;
  }
  .header-brand h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--walnut);
    line-height: 1;
    white-space: nowrap;
  }
  .header-brand span {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13px;
    color: var(--terra);
    white-space: nowrap;
  }

  .header-search {
    flex: 1;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  .header-search input {
    width: 100%;
    height: 42px;
    padding: 0 16px 0 44px;
    border: 1.5px solid var(--cream-deeper);
    border-radius: 99px;
    background: var(--cream-dark);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .header-search input:focus {
    border-color: var(--terra);
    box-shadow: 0 0 0 3px oklch(58% 0.12 42 / 0.12);
  }
  .header-search input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none;
    font-size: 15px;
  }

  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .header-btn {
    width: 40px; height: 40px;
    border: 1.5px solid var(--cream-deeper);
    border-radius: 99px;
    background: var(--cream-dark);
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all var(--transition);
    position: relative;
  }
  .header-btn:hover { border-color: var(--terra); color: var(--terra); background: var(--terra-pale); }
  .header-btn.active { background: var(--terra); border-color: var(--terra); color: white; }

  .fav-count {
    position: absolute; top: -4px; right: -4px;
    width: 16px; height: 16px;
    background: var(--terra);
    color: white;
    border-radius: 99px;
    font-size: 9px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--cream);
  }

  /* ── LAYOUT ── */
  .app-body {
    display: flex;
    margin-top: var(--header-h);
    height: calc(100vh - var(--header-h));
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--cream-dark);
    border-right: 1px solid var(--cream-deeper);
    overflow-y: auto;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 10px 8px;
    margin-top: 4px;
  }

  .cat-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 13.5px;
    cursor: pointer;
    transition: all var(--transition);
    text-align: left;
    width: 100%;
  }
  .cat-btn .cat-icon { font-size: 16px; line-height: 1; width: 22px; text-align: center; flex-shrink: 0; }
  .cat-btn .cat-label { flex: 1; }
  .cat-btn .cat-count {
    font-size: 11px;
    background: var(--cream-deeper);
    color: var(--text-muted);
    padding: 2px 7px;
    border-radius: 99px;
    font-weight: 700;
  }
  .cat-btn:hover { background: var(--terra-pale); color: var(--text); }
  .cat-btn.active { background: var(--terra); color: white; }
  .cat-btn.active .cat-count { background: oklch(58% 0.12 42 / 0.3); color: white; }

  /* ── MAIN CONTENT ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 28px 48px;
  }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 24px;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    color: var(--walnut);
  }
  .section-count {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ── RECIPE GRID ── */
  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  /* ── RECIPE CARD ── */
  .recipe-card {
    border-radius: var(--radius);
    background: var(--cream-dark);
    box-shadow: var(--card-shadow);
    cursor: pointer;
    transition: all var(--transition);
    overflow: hidden;
    border: 1.5px solid transparent;
    position: relative;
  }
  .recipe-card:hover {
    box-shadow: var(--card-shadow-hover);
    transform: translateY(-3px);
    border-color: var(--terra-light);
  }

  .card-img {
    height: 160px;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px;
    position: relative;
    overflow: hidden;
  }
  .card-img-pattern {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 8px,
      oklch(0% 0 0 / 0.04) 8px,
      oklch(0% 0 0 / 0.04) 9px
    );
  }
  .card-emoji { position: relative; z-index: 1; filter: drop-shadow(0 2px 8px oklch(0% 0 0 / 0.15)); }

  .card-body { padding: 14px 16px 16px; }
  .card-cat {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--terra);
    margin-bottom: 5px;
  }
  .card-title {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    color: var(--walnut);
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .card-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .card-meta {
    display: flex; align-items: center; gap: 12px;
  }
  .card-meta-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .card-fav-btn {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px;
    background: var(--cream);
    border: 1.5px solid var(--cream-deeper);
    border-radius: 99px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: all var(--transition);
    z-index: 2;
  }
  .card-fav-btn:hover { background: var(--terra-pale); border-color: var(--terra); transform: scale(1.1); }
  .card-fav-btn.faved { background: var(--terra); border-color: var(--terra); }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 24px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-family: var(--font-display); font-size: 22px; color: var(--walnut); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: oklch(10% 0.03 50 / 0.55);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: 100%;
    max-width: 760px;
    max-height: 90vh;
    background: var(--cream);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 80px oklch(10% 0.04 50 / 0.35);
    animation: slideUp 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-header {
    padding: 28px 32px 0;
    position: relative;
    flex-shrink: 0;
  }

  .modal-hero {
    height: 180px;
    display: flex; align-items: center; justify-content: center;
    font-size: 80px;
    border-radius: 16px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .modal-hero-pattern {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 12px,
      oklch(0% 0 0 / 0.04) 12px, oklch(0% 0 0 / 0.04) 13px
    );
  }
  .modal-hero-emoji { position: relative; z-index: 1; filter: drop-shadow(0 4px 16px oklch(0% 0 0 / 0.2)); }

  .modal-close {
    position: absolute; top: 0; right: 0;
    width: 36px; height: 36px;
    border-radius: 99px;
    border: 1.5px solid var(--cream-deeper);
    background: var(--cream-dark);
    color: var(--text-muted);
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .modal-close:hover { background: var(--terra); border-color: var(--terra); color: white; }

  .modal-cat-tag {
    display: inline-block;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--terra);
    background: var(--terra-pale);
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 28px; font-weight: 700;
    color: var(--walnut);
    margin-bottom: 4px;
    line-height: 1.2;
  }
  .modal-subtitle {
    font-size: 14px; color: var(--text-muted);
    margin-bottom: 20px;
  }

  .modal-stats {
    display: flex; gap: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--cream-deeper);
    flex-wrap: wrap;
  }
  .stat-item {
    display: flex; flex-direction: column; gap: 2px;
  }
  .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  .stat-val { font-size: 18px; font-weight: 700; color: var(--walnut); font-family: var(--font-display); }

  /* servings adjuster */
  .servings-adj {
    display: flex; align-items: center; gap: 8px;
  }
  .adj-btn {
    width: 26px; height: 26px;
    border: 1.5px solid var(--cream-deeper);
    border-radius: 99px;
    background: var(--cream-dark);
    color: var(--text);
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    line-height: 1;
  }
  .adj-btn:hover { background: var(--terra); border-color: var(--terra); color: white; }

  /* modal tabs */
  .modal-tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--cream-deeper);
    flex-shrink: 0;
    padding: 0 32px;
  }
  .tab-btn {
    padding: 12px 20px;
    border: none; background: none;
    font-family: var(--font-body);
    font-size: 13.5px; font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all var(--transition);
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--terra); }
  .tab-btn.active { color: var(--terra); border-bottom-color: var(--terra); }

  /* modal body */
  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px 32px;
  }

  /* INGREDIENTS */
  .ing-list {
    display: flex; flex-direction: column; gap: 8px;
  }
  .ing-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--cream-dark);
    cursor: pointer;
    transition: all var(--transition);
    border: 1.5px solid transparent;
  }
  .ing-item:hover { border-color: var(--terra-light); }
  .ing-item.checked { opacity: 0.5; text-decoration: line-through; background: var(--cream-deeper); }
  .ing-cb {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 2px solid var(--cream-deeper);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    transition: all var(--transition);
    background: var(--cream);
  }
  .ing-item.checked .ing-cb { background: var(--terra); border-color: var(--terra); color: white; }
  .ing-name { flex: 1; font-size: 13.5px; color: var(--text); }
  .ing-amount { font-size: 13px; font-weight: 700; color: var(--terra); white-space: nowrap; }

  /* STEPS */
  .steps-list { display: flex; flex-direction: column; gap: 16px; }
  .step-item {
    display: flex; gap: 14px;
    align-items: flex-start;
  }
  .step-num {
    width: 28px; height: 28px; flex-shrink: 0;
    background: var(--terra);
    color: white;
    border-radius: 99px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    font-family: var(--font-display);
  }
  .step-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    padding-top: 4px;
  }

  /* TIMER */
  .timer-section {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 24px 0;
  }
  .timer-display {
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 700;
    color: var(--walnut);
    letter-spacing: -2px;
    line-height: 1;
  }
  .timer-sub { font-size: 13px; color: var(--text-muted); }
  .timer-ring-wrap {
    position: relative;
    width: 180px; height: 180px;
  }
  .timer-ring {
    width: 180px; height: 180px;
    transform: rotate(-90deg);
  }
  .timer-ring-bg { fill: none; stroke: var(--cream-deeper); stroke-width: 8; }
  .timer-ring-fill { fill: none; stroke: var(--terra); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .timer-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .timer-btns { display: flex; gap: 12px; }
  .timer-btn {
    padding: 10px 24px;
    border-radius: 99px;
    border: 1.5px solid var(--cream-deeper);
    background: var(--cream-dark);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13.5px; font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
  }
  .timer-btn:hover { border-color: var(--terra); }
  .timer-btn.primary { background: var(--terra); border-color: var(--terra); color: white; }
  .timer-btn.primary:hover { opacity: 0.9; }
  .timer-presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .preset-btn {
    padding: 6px 14px;
    border-radius: 99px;
    border: 1.5px solid var(--cream-deeper);
    background: var(--cream-dark);
    color: var(--text-muted);
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
  }
  .preset-btn:hover { border-color: var(--terra); color: var(--terra); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--walnut);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 700;
    z-index: 500;
    animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
    box-shadow: 0 8px 32px oklch(10% 0.04 50 / 0.25);
    display: flex; align-items: center; gap: 8px;
  }
  @keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* DARK MODE TOGGLE */
  .dark-toggle {
    width: 40px; height: 40px;
    border: 1.5px solid var(--cream-deeper);
    border-radius: 99px;
    background: var(--cream-dark);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    transition: all var(--transition);
  }
  .dark-toggle:hover { border-color: var(--terra); background: var(--terra-pale); }

  /* FAVOURITES VIEW */
  .favs-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 24px; text-align: center; color: var(--text-muted);
  }
  .favs-empty .fav-icon { font-size: 48px; margin-bottom: 12px; }
  .favs-empty h3 { font-family: var(--font-display); font-size: 20px; color: var(--walnut); margin-bottom: 6px; }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .header-brand span { display: none; }
    .recipe-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .modal { border-radius: 16px; max-height: 96vh; }
    .modal-header { padding: 18px 20px 0; }
    .modal-body { padding: 18px 20px 24px; }
    .modal-tabs { padding: 0 20px; }
    .modal-title { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const CORRECT_PIN = '030405';

/* ── PIN LOCK SCREEN ── */
function PinLock({ onUnlock }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  const handleKey = (digit) => {
    if (pin.length >= 6) return;
    const next = pin + digit;
    setPin(next);
    setError(false);
    if (next.length === 6) {
      setTimeout(() => {
        if (next === CORRECT_PIN) {
          localStorage.setItem('cookbook_unlocked', '1');
          onUnlock();
        } else {
          setShake(true);
          setError(true);
          setTimeout(() => { setPin(''); setShake(false); }, 700);
        }
      }, 120);
    }
  };

  const handleDel = () => { setPin(p => p.slice(0, -1)); setError(false); };

  // Keyboard support
  useEffect(() => {
    const onKey = (e) => {
      if (e.key >= '0' && e.key <= '9') handleKey(e.key);
      if (e.key === 'Backspace') handleDel();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [pin]);

  const keys = ['1','2','3','4','5','6','7','8','9','empty','0','del'];

  return (
    <div className="pin-overlay">
      <div className="pin-card">
        <div className="pin-brand">
          <div className="pin-brand-icon">🍳</div>
          <h1>Stephanie's Cozy Cookbook</h1>
          <p>Enter your 6-digit PIN to continue</p>
        </div>
        <div className="pin-dots">
          {Array.from({ length: 6 }).map((_, i) => (
            <div
              key={i}
              className={`pin-dot${i < pin.length ? (shake ? ' error' : ' filled') : ''}`}
            />
          ))}
        </div>
        <div className="pin-error-msg">{error ? 'Incorrect PIN — try again' : ''}</div>
        <div className="pin-keypad">
          {keys.map((k, i) => (
            k === 'empty' ? <div key={i} className="pin-key empty"></div> :
            k === 'del' ? (
              <button key={i} className="pin-key del" onClick={handleDel}>⌫</button>
            ) : (
              <button key={i} className="pin-key" onClick={() => handleKey(k)}>{k}</button>
            )
          ))}
        </div>
      </div>
    </div>
  );
}


/* ── HELPERS ── */
const formatTime = (mins) => {
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
};

const formatSeconds = (secs) => {
  const m = Math.floor(secs / 60).toString().padStart(2, '0');
  const s = (secs % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
};

const scaleAmount = (amount, baseServings, currentServings) => {
  const scaled = (amount * currentServings) / baseServings;
  // Format nicely
  if (Number.isInteger(scaled)) return scaled.toString();
  if (scaled < 1) {
    const fractions = [[0.25,'¼'],[0.33,'⅓'],[0.5,'½'],[0.67,'⅔'],[0.75,'¾']];
    const fr = fractions.find(([v]) => Math.abs(scaled - v) < 0.05);
    if (fr) return fr[1];
  }
  const whole = Math.floor(scaled);
  const frac = scaled - whole;
  const fractions = [[0.25,'¼'],[0.33,'⅓'],[0.5,'½'],[0.67,'⅔'],[0.75,'¾']];
  const fr = fractions.find(([v]) => Math.abs(frac - v) < 0.05);
  if (fr && whole > 0) return `${whole}${fr[1]}`;
  return parseFloat(scaled.toFixed(1)).toString();
};

/* ── TOAST ── */
function Toast({ msg }) {
  return <div className="toast">{msg}</div>;
}

/* ── TIMER ── */
function Timer({ defaultMins }) {
  const [totalSecs, setTotalSecs] = useState(defaultMins * 60);
  const [remaining, setRemaining] = useState(defaultMins * 60);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  const start = () => { setRunning(true); };
  const pause = () => setRunning(false);
  const reset = () => { setRunning(false); setRemaining(totalSecs); };
  const setPreset = (mins) => {
    const s = mins * 60;
    setTotalSecs(s); setRemaining(s); setRunning(false);
  };

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setRemaining(r => {
          if (r <= 1) { clearInterval(intervalRef.current); setRunning(false); return 0; }
          return r - 1;
        });
      }, 1000);
    } else clearInterval(intervalRef.current);
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const pct = totalSecs > 0 ? remaining / totalSecs : 0;
  const r = 80;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct);

  return (
    <div className="timer-section">
      <div className="timer-presets">
        {[5,10,15,20,30,45,60].map(m => (
          <button key={m} className="preset-btn" onClick={() => setPreset(m)}>{m}m</button>
        ))}
        <button className="preset-btn" onClick={() => setPreset(defaultMins)}>Recipe ({defaultMins}m)</button>
      </div>
      <div className="timer-ring-wrap">
        <svg className="timer-ring" viewBox="0 0 180 180">
          <circle className="timer-ring-bg" cx="90" cy="90" r={r} />
          <circle
            className="timer-ring-fill"
            cx="90" cy="90" r={r}
            strokeDasharray={circ}
            strokeDashoffset={offset}
          />
        </svg>
        <div className="timer-center">
          <div className="timer-display">{formatSeconds(remaining)}</div>
          <div className="timer-sub">{remaining === 0 ? '🎉 Done!' : running ? 'cooking…' : 'paused'}</div>
        </div>
      </div>
      <div className="timer-btns">
        {!running ? (
          <button className="timer-btn primary" onClick={start} disabled={remaining === 0}>▶ Start</button>
        ) : (
          <button className="timer-btn primary" onClick={pause}>⏸ Pause</button>
        )}
        <button className="timer-btn" onClick={reset}>↺ Reset</button>
      </div>
    </div>
  );
}

/* ── RECIPE MODAL ── */
function RecipeModal({ recipe, isFav, onFav, onClose }) {
  const [tab, setTab] = useState('ingredients');
  const [servings, setServings] = useState(recipe.servings);
  const [checked, setChecked] = useState({});

  const toggleCheck = (i) => setChecked(c => ({ ...c, [i]: !c[i] }));

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  // Dismiss on overlay click
  const handleOverlayClick = (e) => { if (e.target === e.currentTarget) onClose(); };

  const checked_count = Object.values(checked).filter(Boolean).length;

  return (
    <div className="modal-overlay" onClick={handleOverlayClick}>
      <div className="modal">
        {/* Hero */}
        <div className="modal-hero" style={{ background: recipe.color }}>
          <div className="modal-hero-pattern"></div>
          <div className="modal-hero-emoji">{recipe.emoji}</div>
        </div>

        <div className="modal-header">
          <button className="modal-close" onClick={onClose}>✕</button>
          <div className="modal-cat-tag">{recipe.category}</div>
          <h2 className="modal-title">{recipe.title}</h2>
          <p className="modal-subtitle">{recipe.subtitle}</p>
          <div className="modal-stats">
            <div className="stat-item">
              <div className="stat-label">Cook Time</div>
              <div className="stat-val">{formatTime(recipe.time)}</div>
            </div>
            <div className="stat-item">
              <div className="stat-label">Difficulty</div>
              <div className="stat-val" style={{ fontSize: '15px', paddingTop: '3px' }}>{recipe.difficulty}</div>
            </div>
            <div className="stat-item">
              <div className="stat-label">Servings</div>
              <div className="servings-adj">
                <button className="adj-btn" onClick={() => setServings(s => Math.max(1, s - 1))}>−</button>
                <span className="stat-val">{servings}</span>
                <button className="adj-btn" onClick={() => setServings(s => s + 1)}>+</button>
              </div>
            </div>
            <div className="stat-item" style={{ marginLeft: 'auto' }}>
              <div className="stat-label">&nbsp;</div>
              <button
                className="timer-btn"
                style={{ padding: '4px 16px', fontSize: '12px' }}
                onClick={() => setTab('timer')}
              >⏱ Timer</button>
            </div>
            <div className="stat-item">
              <div className="stat-label">&nbsp;</div>
              <button
                onClick={onFav}
                className="timer-btn"
                style={{ padding: '4px 16px', fontSize: '12px', background: isFav ? 'var(--terra)' : undefined, color: isFav ? 'white' : undefined, borderColor: isFav ? 'var(--terra)' : undefined }}
              >{isFav ? '♥ Saved' : '♡ Save'}</button>
            </div>
          </div>
        </div>

        <div className="modal-tabs">
          {['ingredients', 'steps', 'timer'].map(t => (
            <button
              key={t}
              className={`tab-btn${tab === t ? ' active' : ''}`}
              onClick={() => setTab(t)}
            >
              {t === 'ingredients' ? `Ingredients${checked_count > 0 ? ` (${checked_count}/${recipe.ingredients.length})` : ''}` : t === 'steps' ? `Instructions` : '⏱ Timer'}
            </button>
          ))}
        </div>

        <div className="modal-body">
          {tab === 'ingredients' && (
            <div className="ing-list">
              {recipe.ingredients.map((ing, i) => (
                <div
                  key={i}
                  className={`ing-item${checked[i] ? ' checked' : ''}`}
                  onClick={() => toggleCheck(i)}
                >
                  <div className="ing-cb">{checked[i] ? '✓' : ''}</div>
                  <span className="ing-name">{ing.item}</span>
                  <span className="ing-amount">
                    {ing.unit === 'to taste' || ing.unit === 'to serve' || ing.unit === 'generously' || ing.unit === 'handful' || ing.unit === 'pinch'
                      ? ing.unit
                      : `${scaleAmount(ing.amount, recipe.servings, servings)} ${ing.unit}`
                    }
                  </span>
                </div>
              ))}
            </div>
          )}
          {tab === 'steps' && (
            <div className="steps-list">
              {recipe.steps.map((step, i) => (
                <div key={i} className="step-item">
                  <div className="step-num">{i + 1}</div>
                  <p className="step-text">{step}</p>
                </div>
              ))}
            </div>
          )}
          {tab === 'timer' && <Timer defaultMins={recipe.time} />}
        </div>
      </div>
    </div>
  );
}

/* ── RECIPE CARD ── */
function RecipeCard({ recipe, isFav, onFav, onClick }) {
  return (
    <div className="recipe-card" onClick={onClick}>
      <button
        className={`card-fav-btn${isFav ? ' faved' : ''}`}
        onClick={e => { e.stopPropagation(); onFav(); }}
        title={isFav ? 'Remove from favourites' : 'Save recipe'}
      >{isFav ? '♥' : '♡'}</button>
      <div className="card-img" style={{ background: recipe.color }}>
        <div className="card-img-pattern"></div>
        <span className="card-emoji">{recipe.emoji}</span>
      </div>
      <div className="card-body">
        <div className="card-cat">{recipe.category}</div>
        <div className="card-title">{recipe.title}</div>
        <div className="card-subtitle">{recipe.subtitle}</div>
        <div className="card-meta">
          <span className="card-meta-item">⏱ {formatTime(recipe.time)}</span>
          <span className="card-meta-item">· {recipe.difficulty}</span>
          <span className="card-meta-item">· {recipe.servings} servings</span>
        </div>
      </div>
    </div>
  );
}

/* ── ROOT WITH PIN GATE ── */
function Root() {
  const [unlocked, setUnlocked] = useState(
    () => localStorage.getItem('cookbook_unlocked') === '1'
  );
  if (!unlocked) return <PinLock onUnlock={() => setUnlocked(true)} />;
  return <App />;
}

/* ── MAIN APP ── */
function App() {
  const [activeCategory, setActiveCategory] = useState('all');
  const [search, setSearch] = useState('');
  const [openRecipe, setOpenRecipe] = useState(null);
  const [favourites, setFavourites] = useState(() => {
    try { return JSON.parse(localStorage.getItem('cookbook_favs') || '[]'); } catch { return []; }
  });
  const [showFavs, setShowFavs] = useState(false);
  const [dark, setDark] = useState(() => localStorage.getItem('cookbook_dark') === 'true');
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    document.body.classList.toggle('dark', dark);
    localStorage.setItem('cookbook_dark', dark);
  }, [dark]);

  useEffect(() => {
    localStorage.setItem('cookbook_favs', JSON.stringify(favourites));
  }, [favourites]);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2200);
  };

  const toggleFav = useCallback((id, recipeTitle) => {
    setFavourites(f => {
      if (f.includes(id)) {
        showToast(`Removed from saved ♡`);
        return f.filter(x => x !== id);
      } else {
        showToast(`Saved to favourites ♥`);
        return [...f, id];
      }
    });
  }, []);

  // Filter
  const filteredRecipes = RECIPES.filter(r => {
    const inCat = showFavs ? favourites.includes(r.id) : (activeCategory === 'all' || r.category === activeCategory);
    const inSearch = !search || r.title.toLowerCase().includes(search.toLowerCase()) || r.subtitle.toLowerCase().includes(search.toLowerCase()) || r.category.toLowerCase().includes(search.toLowerCase());
    return inCat && inSearch;
  });

  // Category counts
  const catCounts = {};
  CATEGORIES.forEach(c => {
    catCounts[c.id] = c.id === 'all' ? RECIPES.length : RECIPES.filter(r => r.category === c.id).length;
  });

  const sectionTitle = showFavs
    ? 'Saved Recipes'
    : activeCategory === 'all'
    ? 'All Recipes'
    : CATEGORIES.find(c => c.id === activeCategory)?.label || activeCategory;

  return (
    <>
      {/* HEADER */}
      <div className="header">
        <div className="header-brand">
          <h1>Stephanie's Cozy Cookbook</h1>
          <span>50 recipes</span>
        </div>
        <div className="header-search">
          <span className="search-icon">⌕</span>
          <input
            type="text"
            placeholder="Search recipes…"
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
        </div>
        <div className="header-actions">
          <button
            className={`header-btn${showFavs ? ' active' : ''}`}
            onClick={() => setShowFavs(f => !f)}
            title="Saved recipes"
          >
            ♥
            {favourites.length > 0 && !showFavs && (
              <span className="fav-count">{favourites.length}</span>
            )}
          </button>
          <button
            className="dark-toggle"
            onClick={() => setDark(d => !d)}
            title="Toggle dark mode"
          >{dark ? '☀' : '☾'}</button>
        </div>
      </div>

      <div className="app-body">
        {/* SIDEBAR */}
        <nav className="sidebar">
          <div className="sidebar-label">Browse</div>
          {CATEGORIES.map(cat => (
            <button
              key={cat.id}
              className={`cat-btn${!showFavs && activeCategory === cat.id ? ' active' : ''}`}
              onClick={() => { setActiveCategory(cat.id); setShowFavs(false); setSearch(''); }}
            >
              <span className="cat-icon">{cat.icon}</span>
              <span className="cat-label">{cat.label}</span>
              <span className="cat-count">{catCounts[cat.id]}</span>
            </button>
          ))}
          <div className="sidebar-label" style={{ marginTop: '12px' }}>My Book</div>
          <button
            className={`cat-btn${showFavs ? ' active' : ''}`}
            onClick={() => setShowFavs(true)}
          >
            <span className="cat-icon">♥</span>
            <span className="cat-label">Saved Recipes</span>
            <span className="cat-count">{favourites.length}</span>
          </button>
        </nav>

        {/* MAIN */}
        <main className="main">
          <div className="section-header">
            <h2 className="section-title">{sectionTitle}</h2>
            <span className="section-count">{filteredRecipes.length} recipe{filteredRecipes.length !== 1 ? 's' : ''}</span>
          </div>

          {filteredRecipes.length === 0 ? (
            showFavs ? (
              <div className="favs-empty">
                <div className="fav-icon">♡</div>
                <h3>No saved recipes yet</h3>
                <p>Tap the heart on any recipe to save it here.</p>
              </div>
            ) : (
              <div className="empty-state">
                <div className="empty-icon">🔍</div>
                <h3>No recipes found</h3>
                <p>Try a different search or category.</p>
              </div>
            )
          ) : (
            <div className="recipe-grid">
              {filteredRecipes.map(r => (
                <RecipeCard
                  key={r.id}
                  recipe={r}
                  isFav={favourites.includes(r.id)}
                  onFav={() => toggleFav(r.id, r.title)}
                  onClick={() => setOpenRecipe(r)}
                />
              ))}
            </div>
          )}
        </main>
      </div>

      {/* MODAL */}
      {openRecipe && (
        <RecipeModal
          recipe={openRecipe}
          isFav={favourites.includes(openRecipe.id)}
          onFav={() => toggleFav(openRecipe.id)}
          onClose={() => setOpenRecipe(null)}
        />
      )}

      {/* TOAST */}
      {toast && <Toast msg={toast} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
